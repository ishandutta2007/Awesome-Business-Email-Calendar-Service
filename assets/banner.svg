<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Glowing accents -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #cbd5e1; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #f8fafc; }
    
    /* SVG Animations for dynamic floating background nodes */
    @keyframes pulseGlow {
      0% { transform: scale(1) translate(0, 0); opacity: 0.4; }
      50% { transform: scale(1.08) translate(10px, -15px); opacity: 0.7; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
    }
    @keyframes floatCard {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -40; }
    }
    
    .anim-pulse { animation: pulseGlow 8s ease-in-out infinite; }
    .anim-float1 { animation: floatCard 6s ease-in-out infinite; }
    .anim-float2 { animation: floatCard 7s ease-in-out infinite 1s; }
    .anim-dash { stroke-dasharray: 8 8; animation: dashCycle 4s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/>

  <!-- Dynamic Glowing Background Orbs -->
  <g class="anim-pulse">
    <circle cx="200" cy="100" r="180" fill="#6366f1" opacity="0.25" filter="url(#glow)"/>
    <circle cx="1000" cy="300" r="220" fill="#ec4899" opacity="0.2" filter="url(#glow)"/>
    <circle cx="600" cy="200" r="150" fill="#a855f7" opacity="0.15" filter="url(#glow)"/>
  </g>

  <!-- Decorative Grid Mesh in Background -->
  <path d="M0,100 H1200 M0,200 H1200 M0,300 H1200 M300,0 V400 M600,0 V400 M900,0 V400" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Dynamic Decorative Connecting Lines & Data Nodes (Background layer) -->
  <g stroke="url(#accentGrad)" stroke-width="2" class="anim-dash" opacity="0.5">
    <path d="M150 320 C 300 280, 450 350, 600 310 S 900 340, 1050 280" fill="none"/>
    <path d="M100 120 C 350 80, 500 160, 750 100 S 950 140, 1100 90" fill="none"/>
  </g>

  <!-- Floating Decorative Cards (Dynamic elements behind/around main text) -->
  <!-- Floating Card Left: Email Icon -->
  <g class="anim-float1" filter="url(#shadow)">
    <rect x="80" y="220" width="180" height="110" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
    <rect x="100" y="240" width="40" height="40" rx="8" fill="#6366f1"/>
    <!-- Envelope Icon -->
    <path d="M110 252 L120 262 L130 252 M110 252 H130 V268 H110 Z" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="150" y="258" class="badge-text">SMTP / IMAP</text>
    <text x="150" y="276" font-family="sans-serif" font-size="12" fill="#94a3b8">Secure Mail</text>
  </g>

  <!-- Floating Card Right: Calendar Icon -->
  <g class="anim-float2" filter="url(#shadow)">
    <rect x="940" y="70" width="180" height="110" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
    <rect x="960" y="90" width="40" height="40" rx="8" fill="#ec4899"/>
    <!-- Calendar Icon -->
    <path d="M970 102 V118 H990 V102 Z M970 106 H990 M975 100 V104 M985 100 V104" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="1010" y="108" class="badge-text">CalDAV / Sync</text>
    <text x="1010" y="126" font-family="sans-serif" font-size="12" fill="#94a3b8">Groupware</text>
  </g>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accentGrad)"/>

  <!-- MAIN FOREGROUND CONTENT (Guaranteed high contrast & readable) -->
  <g filter="url(#shadow)">
    <!-- Top Pill Badge -->
    <rect x="455" y="55" width="290" height="34" rx="17" fill="url(#accentGrad)" opacity="0.9"/>
    <text x="600" y="77" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff" letter-spacing="1.5">ENTERPRISE &amp; OPEN SOURCE</text>

    <!-- Main Title -->
    <text x="600" y="150" text-anchor="middle" class="title">Business Email &amp; Calendar Service</text>

    <!-- Subtitle -->
    <text x="600" y="195" text-anchor="middle" class="subtitle">Curated Directory of Cloud Suites, Groupware Platforms &amp; Self-Hosted Protocols</text>

    <!-- Sub-badges row in banner foreground -->
    <!-- Badge 1: Commercial SaaS -->
    <rect x="330" y="240" width="160" height="36" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="410" y="263" text-anchor="middle" class="badge-text">🏢 Enterprise SaaS</text>

    <!-- Badge 2: Open Source -->
    <rect x="520" y="240" width="160" height="36" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="600" y="263" text-anchor="middle" class="badge-text">🔓 Open Source</text>

    <!-- Badge 3: CalDAV / CardDAV -->
    <rect x="710" y="240" width="160" height="36" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
    <text x="790" y="263" text-anchor="middle" class="badge-text">📅 CalDAV &amp; IMAP</text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="394" width="1200" height="6" fill="url(#accentGrad)"/>
</svg>
